name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bloomify
          POSTGRES_PASSWORD: bloomify
          POSTGRES_DB: bloomify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bloomify"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bloomify:bloomify@localhost:5432/bloomify
      DJANGO_SETTINGS_MODULE: bloomproject.settings.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-fail-under=80
      - name: Production settings security check
        env:
          DJANGO_SETTINGS_MODULE: bloomproject.settings.prod
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnop
        run: python manage.py check --deploy --fail-level WARNING
