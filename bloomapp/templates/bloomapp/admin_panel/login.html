{% load static bloom %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Staff sign-in – {{ brand }}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'bloomapp/img/favicon.svg' %}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&text=%26&display=swap"/>
  <link rel="stylesheet" href="{% static 'css/main.css' %}"/>
  <style>
    .staff-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.75rem; padding: 2rem var(--gutter); }
    .staff-logo { display: inline-flex; align-items: center; gap: 0.35rem; font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); white-space: nowrap; }
    .staff-card { width: 100%; max-width: 26rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-md); }
    .staff-card h1 { font-size: var(--text-3xl); margin-bottom: 0.35rem; }
    .staff-card .intro { margin-bottom: 1.5rem; }
    .staff-card .form-alert { margin-bottom: 1.25rem; }
    .staff-back { font-size: var(--text-sm); }
    @media (max-width: 480px) { .staff-card { padding: 1.75rem 1.25rem; } }
  </style>
</head>
<body>
<main class="staff-page">
  <a href="{% url 'home' %}" class="staff-logo">{% logo %}</a>
  <div class="staff-card">
    <h1>Staff sign-in</h1>
    <p class="intro">For the {{ brand }} team: orders, products and messages.</p>
    {% for m in messages %}
      <p class="form-alert" role="alert">{% icon 'alert' 18 %} <span>{{ m }}</span></p>
    {% endfor %}
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" autocomplete="username" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required/>
          {% include 'bloomapp/auth/_pw_toggle.html' %}
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
    </form>
  </div>
  <a class="link staff-back" href="{% url 'home' %}">Back to the shop</a>
</main>
<script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
